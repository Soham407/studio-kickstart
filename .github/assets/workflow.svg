<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <title>Scaffold Flow</title>
  <desc>Nine-step project scaffold pipeline from tool validation through commit and push</desc>
  <rect width="1200" height="320" rx="14" fill="#0D1117"/>

  <defs>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58A6FF"/>
    </marker>
    <style>
      .step-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        fill: #8B949E;
        text-anchor: middle;
      }
      .num-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 11px;
        font-weight: 600;
        fill: #ffffff;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Connections Row 1 -->
  <line x1="230" y1="90" x2="328" y2="90" stroke="#30363D" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <line x1="440" y1="90" x2="538" y2="90" stroke="#30363D" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <line x1="650" y1="90" x2="748" y2="90" stroke="#30363D" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <line x1="860" y1="90" x2="958" y2="90" stroke="#30363D" stroke-width="1.5" marker-end="url(#arrowHead)"/>

  <!-- Connection 5 to 6 -->
  <path d="M 1015 135 L 1015 155 L 175 155 L 175 173" fill="none" stroke="#30363D" stroke-width="1.5" marker-end="url(#arrowHead)" stroke-linejoin="round"/>

  <!-- Connections Row 2 -->
  <line x1="230" y1="220" x2="328" y2="220" stroke="#30363D" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <line x1="440" y1="220" x2="538" y2="220" stroke="#30363D" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <line x1="650" y1="220" x2="748" y2="220" stroke="#30363D" stroke-width="1.5" marker-end="url(#arrowHead)"/>

  <!-- Step 1: Validate Tools -->
  <g transform="translate(120, 45)" id="step-1">
    <rect width="110" height="90" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="16" cy="16" r="10" fill="#58A6FF"/>
    <text x="16" y="19.5" class="num-text">1</text>
    <g stroke="#58A6FF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(4, -1)">
         <path d="M59.7 35.3c-.5-.5-1.3-.5-1.7 0l-3.3 3.3a2.4 2.4 0 0 1-3.4 0l-1.4-1.4a2.4 2.4 0 0 1 0-3.4l3.3-3.3c.5-.5.5-1.2 0-1.7-1.3-1.3-3.4-1.3-4.7 0L42.2 35.1c-1.3 1.3-1.3 3.4 0 4.7l1.4 1.4L38 46.8c-.8.8-.8 2 0 2.8l3.4 3.4c.8.8 2 .8 2.8 0l5.6-5.6 1.4 1.4c1.3 1.3 3.4 1.3 4.7 0l6.3-6.3c1.3-1.3 1.3-3.4 0-4.7z"/>
      </g>
    </g>
    <text x="55" y="75" class="step-text">Validate Tools</text>
  </g>

  <!-- Step 2: Create Framework -->
  <g transform="translate(330, 45)" id="step-2">
    <rect width="110" height="90" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="16" cy="16" r="10" fill="#58A6FF"/>
    <text x="16" y="19.5" class="num-text">2</text>
    <g stroke="#58A6FF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="55,27 68,33 55,39 42,33"/>
      <polyline points="42,39 55,45 68,39"/>
      <polyline points="42,45 55,51 68,45"/>
    </g>
    <text x="55" y="75" class="step-text">Create Framework</text>
  </g>

  <!-- Step 3: GitHub Repo -->
  <g transform="translate(540, 45)" id="step-3">
    <rect width="110" height="90" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="16" cy="16" r="10" fill="#58A6FF"/>
    <text x="16" y="19.5" class="num-text">3</text>
    <g stroke="#58A6FF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="50" y1="28" x2="50" y2="52"/>
      <circle cx="50" cy="25" r="3"/>
      <circle cx="50" cy="55" r="3"/>
      <path d="M50 43 C 60 43, 60 34, 60 34"/>
      <circle cx="60" cy="31" r="3"/>
    </g>
    <text x="55" y="75" class="step-text">GitHub Repo</text>
  </g>

  <!-- Step 4: Inject Skills -->
  <g transform="translate(750, 45)" id="step-4">
    <rect width="110" height="90" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="16" cy="16" r="10" fill="#58A6FF"/>
    <text x="16" y="19.5" class="num-text">4</text>
    <g stroke="#58A6FF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M48 26 H58 L66 34 V52 A2 2 0 0 1 64 54 H48 A2 2 0 0 1 46 52 V28 A2 2 0 0 1 48 26 Z"/>
      <polyline points="58,26 58,34 66,34"/>
    </g>
    <text x="55" y="75" class="step-text">Inject Skills</text>
  </g>

  <!-- Step 5: Wire MCP -->
  <g transform="translate(960, 45)" id="step-5">
    <rect width="110" height="90" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="16" cy="16" r="10" fill="#58A6FF"/>
    <text x="16" y="19.5" class="num-text">5</text>
    <g stroke="#58A6FF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="47" y="34" width="12" height="12" rx="2"/>
      <line x1="43" y1="37" x2="47" y2="37"/>
      <line x1="43" y1="43" x2="47" y2="43"/>
      <line x1="59" y1="40" x2="67" y2="40"/>
    </g>
    <text x="55" y="75" class="step-text">Wire MCP</text>
  </g>

  <!-- Step 6: DB & Auth -->
  <g transform="translate(120, 175)" id="step-6">
    <rect width="110" height="90" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="16" cy="16" r="10" fill="#58A6FF"/>
    <text x="16" y="19.5" class="num-text">6</text>
    <g stroke="#58A6FF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="55" cy="30" rx="10" ry="4"/>
      <path d="M45 30 V 50 A 10 4 0 0 0 65 50 V 30"/>
      <path d="M45 40 A 10 4 0 0 0 65 40"/>
    </g>
    <text x="55" y="75" class="step-text">DB &amp; Auth</text>
  </g>

  <!-- Step 7: Guardrails -->
  <g transform="translate(330, 175)" id="step-7">
    <rect width="110" height="90" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="16" cy="16" r="10" fill="#58A6FF"/>
    <text x="16" y="19.5" class="num-text">7</text>
    <g stroke="#58A6FF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M45 28 L55 24 L65 28 V 38 C 65 47, 55 54, 55 54 C 55 54, 45 47, 45 38 Z"/>
    </g>
    <text x="55" y="75" class="step-text">Guardrails</text>
  </g>

  <!-- Step 8: Agent Docs -->
  <g transform="translate(540, 175)" id="step-8">
    <rect width="110" height="90" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="16" cy="16" r="10" fill="#58A6FF"/>
    <text x="16" y="19.5" class="num-text">8</text>
    <g stroke="#58A6FF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="44" y="26" width="22" height="28" rx="2"/>
      <line x1="49" y1="34" x2="61" y2="34"/>
      <line x1="49" y1="40" x2="61" y2="40"/>
      <line x1="49" y1="46" x2="56" y2="46"/>
    </g>
    <text x="55" y="75" class="step-text">Agent Docs</text>
  </g>

  <!-- Step 9: Commit & Push -->
  <g transform="translate(750, 175)" id="step-9">
    <rect width="110" height="90" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="16" cy="16" r="10" fill="#58A6FF"/>
    <text x="16" y="19.5" class="num-text">9</text>
    <g stroke="#58A6FF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="55" cy="40" r="14"/>
      <line x1="55" y1="47" x2="55" y2="33"/>
      <polyline points="50,38 55,33 60,38"/>
    </g>
    <text x="55" y="75" class="step-text">Commit &amp; Push</text>
  </g>

  <!-- Legend -->
  <g transform="translate(980, 264)" id="legend-pill">
    <rect width="190" height="32" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="95" y="21" fill="#3FB950" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">kickstart --web my-app</text>
  </g>
</svg>
