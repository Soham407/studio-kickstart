<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title>Studio Kickstart</title>
  <desc>CLI project bootstrapper that scaffolds agent-ready apps with frameworks, skills, MCP servers, and quality gates</desc>
  <defs>
    <pattern id="dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1" fill="#161B22" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#58A6FF" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="#0D1117" rx="16" />
  
  <!-- Dot Grid for right portion -->
  <rect x="600" y="0" width="600" height="400" fill="url(#dot-grid)" />

  <!-- Left Side: Title Block -->
  <g id="title-block" transform="translate(64, 40)">
    <!-- Category Label -->
    <text x="0" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8B949E" letter-spacing="2" font-weight="600">CLI · PROJECT BOOTSTRAPPER</text>
    
    <!-- Project Name -->
    <text x="0" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="800" fill="#E6EDF3">Studio</text>
    <text x="0" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="800" fill="#58A6FF">Kickstart</text>
    
    <!-- Description -->
    <text x="0" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#8B949E">One command to scaffold agent-ready apps</text>
    <text x="0" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#8B949E">with frameworks, skills, and guardrails.</text>
    
    <!-- Install Badge -->
    <g id="install-badge" transform="translate(0, 275)">
      <rect x="0" y="0" width="310" height="40" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
      <text x="16" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#3FB950">$</text>
      <text x="32" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#E6EDF3">npm install -g studio-kickstart</text>
    </g>
    
    <!-- Metadata Pills -->
    <g id="metadata" transform="translate(0, 335)">
      <rect x="0" y="0" width="70" height="26" rx="13" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <text x="35" y="17.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#58A6FF" text-anchor="middle">v1.2.0</text>
      
      <rect x="80" y="0" width="50" height="26" rx="13" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <text x="105" y="17.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8B949E" text-anchor="middle">MIT</text>
      
      <rect x="140" y="0" width="90" height="26" rx="13" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <text x="185" y="17.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8B949E" text-anchor="middle">31 skills</text>
    </g>
  </g>

  <!-- Right Side: Pipeline Visualization -->
  <g id="pipeline-viz" transform="translate(560, 60)">
    
    <!-- Arrows connecting stages -->
    <line x1="88" y1="44" x2="132" y2="44" stroke="#30363D" stroke-width="1.5" marker-end="url(#arrow)" />
    <line x1="228" y1="44" x2="272" y2="44" stroke="#30363D" stroke-width="1.5" marker-end="url(#arrow)" />
    <line x1="324" y1="88" x2="324" y2="132" stroke="#30363D" stroke-width="1.5" marker-end="url(#arrow)" />
    <line x1="368" y1="164" x2="412" y2="164" stroke="#30363D" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Box 1: INIT -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="88" height="88" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
      <rect x="0" y="24" width="4" height="40" rx="2" fill="#58A6FF" /> <!-- Accent -->
      <g transform="translate(44, 40)">
        <circle cx="0" cy="0" r="12" fill="none" stroke="#8B949E" stroke-width="1.5" />
        <circle cx="0" cy="0" r="4" fill="none" stroke="#8B949E" stroke-width="1.5" />
        <path d="M 0 -12 L 0 -16 M 0 12 L 0 16 M -12 0 L -16 0 M 12 0 L 16 0" stroke="#8B949E" stroke-width="1.5" stroke-linecap="round" />
        <path d="M -8.5 -8.5 L -11.3 -11.3 M 8.5 8.5 L 11.3 11.3 M 8.5 -8.5 L 11.3 -11.3 M -8.5 8.5 L -11.3 11.3" stroke="#8B949E" stroke-width="1.5" stroke-linecap="round" />
      </g>
      <text x="44" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8B949E" text-anchor="middle">INIT</text>
    </g>

    <!-- Box 2: SCAFFOLD -->
    <g transform="translate(140, 0)">
      <rect x="0" y="0" width="88" height="88" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
      <g transform="translate(44, 38)">
        <path d="M -20 -8 L 0 -16 L 20 -8 L 0 0 Z" fill="none" stroke="#8B949E" stroke-width="1.5" stroke-linejoin="round" />
        <path d="M -20 0 L 0 8 L 20 0" fill="none" stroke="#8B949E" stroke-width="1.5" stroke-linejoin="round" />
        <path d="M -20 8 L 0 16 L 20 8" fill="none" stroke="#8B949E" stroke-width="1.5" stroke-linejoin="round" />
      </g>
      <text x="44" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8B949E" text-anchor="middle">SCAFFOLD</text>
    </g>

    <!-- Box 3: SKILLS -->
    <g transform="translate(280, 0)">
      <rect x="0" y="0" width="88" height="88" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
      <g transform="translate(44, 40)">
        <rect x="-12" y="-16" width="24" height="32" rx="3" fill="none" stroke="#8B949E" stroke-width="1.5" />
        <line x1="-6" y1="-8" x2="6" y2="-8" stroke="#8B949E" stroke-width="1.5" stroke-linecap="round" />
        <line x1="-6" y1="0" x2="4" y2="0" stroke="#8B949E" stroke-width="1.5" stroke-linecap="round" />
        <line x1="-6" y1="8" x2="2" y2="8" stroke="#8B949E" stroke-width="1.5" stroke-linecap="round" />
      </g>
      <text x="44" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8B949E" text-anchor="middle">SKILLS</text>
    </g>

    <!-- Box 4: GUARDS -->
    <g transform="translate(280, 140)">
      <rect x="0" y="0" width="88" height="88" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
      <g transform="translate(44, 40)">
        <path d="M -12 -14 L 12 -14 L 12 2 C 12 14 0 22 0 22 C 0 22 -12 14 -12 2 Z" fill="none" stroke="#8B949E" stroke-width="1.5" stroke-linejoin="round" />
      </g>
      <text x="44" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8B949E" text-anchor="middle">GUARDS</text>
    </g>

    <!-- Box 5: SHIP -->
    <g transform="translate(420, 140)">
      <rect x="0" y="0" width="88" height="88" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
      <g transform="translate(44, 40)">
        <path d="M 0 -14 C 6 -6 8 4 8 10 L -8 10 C -8 4 -6 -6 0 -14 Z" fill="none" stroke="#8B949E" stroke-width="1.5" stroke-linejoin="round" />
        <path d="M -8 10 L -12 16 M 8 10 L 12 16" stroke="#8B949E" stroke-width="1.5" stroke-linecap="round" />
        <circle cx="0" cy="0" r="2" fill="#8B949E" />
      </g>
      <text x="44" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8B949E" text-anchor="middle">SHIP</text>
    </g>
  </g>
</svg>
